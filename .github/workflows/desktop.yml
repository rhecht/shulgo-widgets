# Builds the ShulGo desktop widget for all three desktops at once.
#
# Why this exists: desktop is one Electron codebase that already knows how to be a macOS
# menu-bar app, a Windows tray app and a Linux tray app — but each installer can only be made ON the
# system it is for. Rather than hunting for a Windows machine and a Linux machine, GitHub lends us one
# of each for the length of a build.
#
# Nothing here is signed. An unsigned Mac build warns on first open; an unsigned Windows installer gets
# a SmartScreen warning. Signing needs secrets (and, on Windows, a bought certificate), and is a
# separate step — see docs/TODO.md.
name: Build the desktop widget
# On demand, or on a release tag. Deliberately NOT on every push: three machines for a documentation
# typo is waste, and mixing a paths filter with a tags filter is the kind of GitHub subtlety that ends
# with a release tag quietly building nothing.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false        # a Windows failure shouldn't throw away a good Mac build
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          # Asahi Linux and Fedora Asahi Remix run on Apple Silicon, which is arm64: the amd64
          # AppImage and .deb above will not start there at all. GitHub lends arm64 Linux runners,
          # free on a public repository, so this is one more matrix row rather than a problem.
          # electron-builder takes the runner's own architecture when none is pinned, so the same
          # `npm run dist` yields arm64 here and the file names carry an -arm64 suffix.
          #
          # The .deb only, and that is a defect in electron-builder rather than a choice. Its arm64
          # AppImage runtime is linked against an unversioned `libz.so`, which lives in zlib1g-dev
          # and so is absent from every machine that has not installed build tools; the amd64
          # runtime correctly names `libz.so.1`, which is in the zlib1g everything has. The arm64
          # AppImage in desktop-v1.0.0 therefore died with "error while loading shared libraries:
          # libz.so" on a stock Debian 13, and has been deleted from that release. Until the
          # runtime is fixed upstream, arm64 Linux is served by the .deb, which was tested and
          # starts. Pinning `arch` in package.json would not do this: on this runner it would build
          # an x64 AppImage and overwrite the good one from the row above.
          - os: ubuntu-24.04-arm
            name: linux-arm64
            dist_args: --linux deb rpm pacman
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      # Only the Linux rows build a .deb, and both of them now use the system fpm rather than
      # electron-builder's own.
      #
      # electron-builder bundles its packager as fpm-1.9.3-2.3.1-linux-x86 — an x86 binary — and
      # runs it whatever the host is. On the arm64 runner that is "cannot execute binary file:
      # Exec format error", after the AppImage has already been built, so the first desktop-v1.0.0
      # produced a good arm64 AppImage, failed on the .deb, and skipped the release job — which
      # left three other platforms' finished installers with nowhere to go.
      #
      # The second attempt installed fpm for the arm64 row alone and set USE_SYSTEM_FPM to an
      # empty string elsewhere. That broke the amd64 row, which had been fine: electron-builder
      # tests whether the variable is SET, and a variable set to an empty string is set, so amd64
      # went looking for a system fpm nobody had installed there — "exec: fpm: executable file not
      # found in $PATH". The comment beside that line said electron-builder tests for set-ness and
      # then set it to empty anyway.
      #
      # Hence no per-row cleverness. fpm is installed wherever a .deb is built, and the variable is
      # set unconditionally, which is safe because mac builds dmg and zip and Windows builds nsis:
      # neither ever invokes fpm, as both proved by passing in that second attempt with the
      # variable set.
      - name: An fpm this machine can run
        if: runner.os == 'Linux'
        run: sudo gem install --no-document fpm
      # fpm shells out to rpmbuild for the .rpm, and an Ubuntu runner has no rpm tooling at all.
      # Without this the Fedora, RHEL and openSUSE package is the one that silently never appears.
      - name: rpmbuild, for the .rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build
        # predist copies ../shulgo-core in. --publish never: we attach the files ourselves below, so a
        # missing token is never an error.
        # dist_args is empty on every row but linux-arm64, where it drops the AppImage. See the
        # matrix above for why.
        run: npm run dist -- --publish never ${{ matrix.dist_args }}
        env:
          # Without this, electron-builder goes looking for a signing identity in the runner's empty
          # keychain and fails rather than producing an unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_SYSTEM_FPM: 'true'
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: shulgo-desktop-${{ matrix.name }}
          # Only what a person would install. The unpacked tree and the blockmaps are build litter.
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.pacman
          if-no-files-found: error
          retention-days: 30

  # The two Python widgets, which are what 32-bit Linux has to use. Electron has shipped no
  # linux-ia32 build since version 4 — its releases carry linux-x64, linux-arm64 and linux-armv7l
  # and nothing else — so on an i686 machine the desktop app is not merely awkward, it does not
  # exist. shulgo-xfce and shulgo-gtk2 are what runs there, and until now neither had a package
  # anybody could download and open.
  #
  # One ordinary Ubuntu runner builds both: there is nothing compiled, so each package is
  # architecture-independent and the same file installs on i686, x86_64 and arm64. They ride in the
  # same release as the desktop app so that one page has every way of getting ShulGo onto a
  # computer, which is the whole point of the exercise.
  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fpm, and rpmbuild for the .rpm
        run: |
          sudo gem install --no-document fpm
          sudo apt-get update && sudo apt-get install -y rpm
      - name: Build the packages
        run: sh packaging/build-linux-widgets.sh "$GITHUB_WORKSPACE/widget-packages"
      - uses: actions/upload-artifact@v4
        with:
          name: shulgo-widgets-linux
          path: widget-packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    # Only for a deliberate tag: `git tag desktop-v1.0.0 && git push origin desktop-v1.0.0`.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build, widgets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # "ShulGo desktop desktop-v1.0.0" is what `ShulGo desktop ${{ github.ref_name }}` produced,
      # and the release title is a public thing. GitHub expressions cannot strip a prefix, so the
      # shell does it.
      - name: The version, without the tag's prefix
        id: version
        run: echo "number=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: true            # so nothing reaches anyone before you have looked at it
          name: ShulGo desktop ${{ steps.version.outputs.number }}
          # Which file to take is not obvious from the names alone: electron-builder gives the NSIS
          # installer and the portable build the same extension and nearly the same name, and the
          # two Mac architectures differ by one word. Saying so here costs four lines and saves
          # somebody downloading 91 MB of the wrong thing.
          # The version is substituted rather than typed, because it was typed for desktop-v1.0.0
          # and the next tag would have published notes naming the previous tag's files.
          body: |
            The ShulGo desktop widget: the next minyan near you in the menu bar or tray, with events,
            mikvaos and today's zmanim.

            **Which file?**

            - **Mac** — `ShulGo-${{ steps.version.outputs.number }}-arm64.dmg` for Apple Silicon
              (M1 and later), `ShulGo-${{ steps.version.outputs.number }}.dmg` for an Intel Mac. The
              `.zip` files are the same app without the disk image.
            - **Windows** — `ShulGo.Setup.${{ steps.version.outputs.number }}.exe` installs it.
              `ShulGo.${{ steps.version.outputs.number }}.exe` is the portable build: it runs where
              you put it and installs nothing.
            - **Linux, 64-bit** — take the one your system uses: `.deb` for Debian, Ubuntu and
              Mint; `.rpm` for Fedora, RHEL and openSUSE; `.pacman` for Arch and Manjaro; or the
              `.AppImage`, which needs no installing at all. Files with `arm64` in the name are for
              Apple Silicon under Asahi, a Raspberry Pi and other arm64 machines — there is no
              arm64 AppImage, because electron-builder's arm64 runtime asks the system for a
              library that is not there.
            - **Linux, 32-bit** — `shulgo-xfce_*_all.deb` or `shulgo-xfce-*.noarch.rpm`. This is a
              different, much lighter widget, in Python rather than Electron, and it is what 32-bit
              machines need: Electron has shipped no 32-bit Linux build since 2018. The same file
              installs on 32-bit and 64-bit alike. For a really old desktop — Ubuntu 7.10 and its
              kin — `shulgo-gtk2_*_all.deb`.

            **Removing it.** Uninstall the usual way for your system: Add or Remove Programs on
            Windows, your package manager or software centre on Linux, or drag the app to the Trash
            on a Mac. That leaves your settings and the key linking this computer behind, so there
            is also **Remove ShulGo from this computer** in Settings, which clears those, stops it
            opening at login and shows you where to unlink the computer from your account.

            These builds are **not signed yet**. macOS will say the app is from an unidentified
            developer (right-click › Open the first time); Windows SmartScreen will warn before the
            installer runs. Linux AppImage and .deb need no signature.
