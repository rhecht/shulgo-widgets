<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>ShulGo</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="glass-tint">
  <header>
    <button class="where" id="where" title="Look somewhere else">
      <div class="place" id="place">ShulGo</div>
      <div class="hebrew" id="hebrew"></div>
    </button>
    <button class="icon-button" id="refresh" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 0 5.27 7.1.9.9 0 0 0-1.72-.52A3.7 3.7 0 1 1 8 4.3c.9 0 1.73.32 2.37.86L9.1 6.42a.45.45 0 0 0 .32.77h3.4a.45.45 0 0 0 .45-.45v-3.4a.45.45 0 0 0-.77-.32l-1.07 1.07A5.48 5.48 0 0 0 8 2.5z"/></svg>
    </button>
    <button class="icon-button" id="settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8zm0 1.5a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8z"/><path d="m13.6 8 1-.8a.6.6 0 0 0 .14-.76l-1.2-2.08a.6.6 0 0 0-.72-.27l-1.23.44a4.9 4.9 0 0 0-.98-.57l-.2-1.3a.6.6 0 0 0-.6-.5H7.19a.6.6 0 0 0-.6.5l-.2 1.3c-.34.15-.67.34-.97.57l-1.23-.44a.6.6 0 0 0-.72.27L2.26 6.44A.6.6 0 0 0 2.4 7.2l1 .8c-.02.17-.03.34-.03.5s.01.33.04.5l-1 .8a.6.6 0 0 0-.15.76l1.2 2.08a.6.6 0 0 0 .72.27l1.23-.44c.3.23.63.42.98.57l.2 1.3a.6.6 0 0 0 .59.5h2.62a.6.6 0 0 0 .6-.5l.2-1.3c.34-.15.67-.34.97-.57l1.23.44a.6.6 0 0 0 .72-.27l1.2-2.08a.6.6 0 0 0-.14-.76l-1-.8c.02-.17.03-.34.03-.5s-.01-.33-.04-.5zm-1.47 2.2.86.69-.73 1.26-1.05-.37-.46.4c-.3.25-.63.45-1 .6l-.56.22-.17 1.1H7.57l-.17-1.1-.57-.23a3.4 3.4 0 0 1-.99-.58l-.46-.4-1.05.37-.73-1.26.86-.7-.07-.6a3.6 3.6 0 0 1 0-.78l.07-.6-.86-.7.73-1.25 1.05.37.46-.4c.3-.25.63-.45 1-.6l.56-.22.17-1.1h1.46l.17 1.1.57.23c.36.14.69.34.99.58l.46.4 1.05-.37.73 1.26-.86.69.07.6a3.6 3.6 0 0 1 0 .79z"/></svg>
    </button>
  </header>

  <div class="search" id="search" hidden>
    <div class="search-row">
      <input type="search" id="search-input" placeholder="A city, neighborhood or zip" autocomplete="off" spellcheck="false">
      <button class="icon-button" id="search-close" title="Close" aria-label="Close">✕</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <nav id="tabs" role="tablist"></nav>

  <main id="content"></main>

  <footer>
    <span class="updated" id="updated"></span>
    <button id="open-site">Open ShulGo</button>
  </footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
